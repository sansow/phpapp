apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: php-app-trigger-template
spec:
  params:
  - name: git-url
  - name: git-revision
  resourcetemplates:
  - apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: php-app-run-
    spec:
      pipelineRef:
        name: php-app-pipeline
      params:
      - { name: git-url, value: $(tt.params.git-url) }
      - { name: git-revision, value: $(tt.params.git-revision) }
      workspaces:
      - name: shared-workspace
        persistentVolumeClaim:
          claimName: pipeline-workspace
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: php-app-trigger-binding
spec:
  params:
  - name: git-url
    value: $(body.repository.clone_url)   # GitHub payload; adjust for GitLab
  - name: git-revision
    value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: php-app
spec:
  serviceAccountName: pipeline
  triggers:
  - name: on-push
    bindings:
    - ref: php-app-trigger-binding
    template:
      ref: php-app-trigger-template
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: el-php-app
spec:
  to:
    kind: Service
    name: el-php-app
  port:
    targetPort: http-listener
  tls:
    termination: edge
