apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql
  labels: { app: mssql }
spec:
  replicas: 1
  strategy:
    type: Recreate           # single writer on the data volume
  selector:
    matchLabels: { app: mssql }
  template:
    metadata:
      labels: { app: mssql }
    spec:
      serviceAccountName: mssql-sa   # anyuid SCC — see Module 1.8
      securityContext:
        runAsUser: 10001             # the image's mssql user
        fsGroup: 10001
      containers:
      - name: mssql
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
          name: mssql
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_PID
          value: "Developer"         # lab/dev only — license for production
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef: { name: mssql-credentials, key: MSSQL_SA_PASSWORD }
        resources:
          requests: { cpu: 500m, memory: 2Gi }
          limits:   { cpu: "2",  memory: 4Gi }
        readinessProbe:
          tcpSocket: { port: 1433 }
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 1433 }
          initialDelaySeconds: 60
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /var/opt/mssql
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: mssql-data }
