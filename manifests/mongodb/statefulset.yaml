apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels: { app: mongodb }
spec:
  serviceName: mongodb-headless
  replicas: 1
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      containers:
      - name: mongodb
        image: docker.io/library/mongo:7.0
        ports:
        - containerPort: 27017
          name: mongo
        envFrom:
        - secretRef: { name: mongodb-credentials }
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits:   { cpu: "1",  memory: 1Gi }
        readinessProbe:
          exec:
            command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data/db
  volumeClaimTemplates:        # one PVC per pod, survives pod deletion
  - metadata:
      name: data
      labels: { app: mongodb }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests: { storage: 5Gi }
      # storageClassName: <set explicitly if no default StorageClass>
